# Serves the built React app as static files and reverse-proxies /api to the
# api container. This container sits BEHIND Nginx Proxy Manager, which is
# the one talking to the internet and terminating SSL for
# romaneio.enviadaki.com.br — so this file only needs to listen on plain
# HTTP internally.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 15m;

    # API + Clerk proxy path (/api/__clerk/...) -> api container.
    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets: allow long-lived caching.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: everything else falls back to index.html so
    # client-side routing (wouter) works on a hard refresh / deep link.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
