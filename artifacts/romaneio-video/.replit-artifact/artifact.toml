kind = "video"
previewPath = "/romaneio-video/"
title = "Sistema de Romaneios — Vídeo"
version = "1.0.0"
id = "artifacts/romaneio-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/romaneio-video/" ]
localPort = 22629

[services.development]
run = "pnpm --filter @workspace/romaneio-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/romaneio-video", "run", "build" ]
publicDir = "artifacts/romaneio-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22629"
BASE_PATH = "/romaneio-video/"
