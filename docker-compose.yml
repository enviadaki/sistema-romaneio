name: sistema-romaneio

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-romaneio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-romaneios}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-romaneio} -d ${POSTGRES_DB:-romaneios}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      ARCO_API_KEY: ${ARCO_API_KEY}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  frontend:
    build:
      context: .
      target: frontend
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
    restart: unless-stopped
    depends_on: [api]
    networks: [internal, proxy]

  # Same reverse-proxy / SSL pattern already used for the Nextcloud server:
  # NPM is the only thing publishing ports to the internet; it terminates
  # TLS for romaneio.enviadaki.com.br and forwards to the frontend container.
  npm:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81" # admin UI - consider closing this in the security group once configured
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    networks: [proxy]

networks:
  internal: # postgres <-> api <-> frontend, not reachable from outside
  proxy: # frontend <-> npm

volumes:
  postgres-data:
  npm-data:
  npm-letsencrypt:
