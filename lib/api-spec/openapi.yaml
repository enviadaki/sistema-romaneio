openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for Sistema de Romaneios
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: packages
    description: Package management
  - name: scans
    description: Scan operations
  - name: romaneio
    description: Romaneio generation
  - name: stats
    description: Statistics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /packages/clear:
    delete:
      operationId: clearPackages
      tags: [packages]
      summary: Delete all packages registered on a given date (or all if no date)
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
          description: ISO date (YYYY-MM-DD). If omitted, deletes ALL packages.
      responses:
        "200":
          description: Number of deleted packages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearPackagesResult"

  /packages:
    get:
      operationId: listPackages
      tags: [packages]
      summary: List all packages
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Package"
    post:
      operationId: createPackage
      tags: [packages]
      summary: Create a single package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageInput"
      responses:
        "201":
          description: Package created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Package"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Tracking number already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /packages/bulk:
    post:
      operationId: bulkCreatePackages
      tags: [packages]
      summary: Bulk import packages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageBulkInput"
      responses:
        "201":
          description: Packages imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /packages/{id}:
    delete:
      operationId: deletePackage
      tags: [packages]
      summary: Delete a package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cities:
    get:
      operationId: listCities
      tags: [packages]
      summary: List distinct cities from packages
      responses:
        "200":
          description: List of cities
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /scans:
    get:
      operationId: listScans
      tags: [scans]
      summary: List scan history
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
        - name: date
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of scans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scan"
    post:
      operationId: createScan
      tags: [scans]
      summary: Record a package scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanInput"
      responses:
        "201":
          description: Scan recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "404":
          description: Tracking number not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Package already scanned today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scans/{id}:
    delete:
      operationId: deleteScan
      tags: [scans]
      summary: Remove a scan from history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /romaneio:
    get:
      operationId: getRomaneio
      tags: [romaneio]
      summary: Get romaneio for a city/route and date
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
        - name: cities
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated list of cities (route mode)
        - name: label
          in: query
          required: false
          schema:
            type: string
          description: Display label for the romaneio (route name)
        - name: date
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Romaneio data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Romaneio"
        "400":
          description: Missing parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Package:
      type: object
      required: [id, trackingNumber, city, promisedDeliveryDate, createdAt]
      properties:
        id:
          type: integer
        trackingNumber:
          type: string
        city:
          type: string
        promisedDeliveryDate:
          type: string
        createdAt:
          type: string

    PackageInput:
      type: object
      required: [trackingNumber, city, promisedDeliveryDate]
      properties:
        trackingNumber:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        promisedDeliveryDate:
          type: string
          minLength: 1

    PackageBulkInput:
      type: object
      required: [packages]
      properties:
        packages:
          type: array
          items:
            $ref: "#/components/schemas/PackageInput"

    BulkImportResult:
      type: object
      required: [imported, skipped, errors]
      properties:
        imported:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: string

    Scan:
      type: object
      required: [id, trackingNumber, city, scanDate, scannedAt]
      properties:
        id:
          type: integer
        trackingNumber:
          type: string
        city:
          type: string
        scanDate:
          type: string
        scannedBy:
          type: ["string", "null"]
        scannedAt:
          type: string

    ScanInput:
      type: object
      required: [trackingNumber, city]
      properties:
        trackingNumber:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1

    Romaneio:
      type: object
      required: [city, date, packages, totalCount]
      properties:
        city:
          type: string
        date:
          type: string
        totalCount:
          type: integer
        packages:
          type: array
          items:
            $ref: "#/components/schemas/RomaneioItem"

    RomaneioItem:
      type: object
      required: [trackingNumber, city, promisedDeliveryDate]
      properties:
        trackingNumber:
          type: string
        city:
          type: string
        promisedDeliveryDate:
          type: string

    Stats:
      type: object
      required: [totalPackages, totalScansToday, totalCities, recentScans, packagesByCity, scansByOperator, scansByCity]
      properties:
        totalPackages:
          type: integer
        totalScansToday:
          type: integer
        totalCities:
          type: integer
        recentScans:
          type: array
          items:
            $ref: "#/components/schemas/Scan"
        packagesByCity:
          type: array
          items:
            $ref: "#/components/schemas/CityCount"
        scansByOperator:
          type: array
          items:
            $ref: "#/components/schemas/OperatorCount"
        scansByCity:
          type: array
          items:
            $ref: "#/components/schemas/CityCount"

    OperatorCount:
      type: object
      required: [operator, count]
      properties:
        operator:
          type: string
        count:
          type: integer

    CityCount:
      type: object
      required: [city, count]
      properties:
        city:
          type: string
        count:
          type: integer

    ClearPackagesResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
