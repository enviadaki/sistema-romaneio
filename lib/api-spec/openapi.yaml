openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for Sistema de Romaneios
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: packages
    description: Package management
  - name: scans
    description: Scan operations
  - name: romaneio
    description: Romaneio generation
  - name: stats
    description: Statistics
  - name: arco
    description: Arco Loggi integration

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /arco/ping:
    get:
      operationId: arcoPing
      tags: [arco]
      summary: Check Arco integration connectivity
      responses:
        "200":
          description: Arco integration health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArcoPingResult"

  /arco/lookup:
    get:
      operationId: arcoLookup
      tags: [arco]
      summary: Look up a package for Arco
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Package tracking number
        - name: apiKey
          in: query
          required: false
          schema:
            type: string
          description: Arco API key. Prefer the X-API-Key header when possible.
        - name: X-API-Key
          in: header
          required: false
          schema:
            type: string
          description: Arco API key
      responses:
        "200":
          description: Package lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArcoLookupResult"
        "400":
          description: Missing tracking code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /arco/config:
    get:
      operationId: getArcoConfig
      tags: [arco]
      summary: Get Arco integration configuration for administrators
      responses:
        "200":
          description: Arco integration configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArcoConfig"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /packages/clear:
    delete:
      operationId: clearPackages
      tags: [packages]
      summary: Delete packages filtered by operation and optional date range
      parameters:
        - name: operation
          in: query
          required: false
          schema:
            type: string
          description: Restrict deletion to this operation (e.g. LOGGI, AMAZON). If omitted, deletes across all operations.
        - name: date
          in: query
          required: false
          schema:
            type: string
          description: ISO date (YYYY-MM-DD). Single-day shorthand; superseded by dateFrom/dateTo.
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
          description: ISO date (YYYY-MM-DD). Start of date range (inclusive).
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
          description: ISO date (YYYY-MM-DD). End of date range (inclusive).
      responses:
        "200":
          description: Number of deleted packages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearPackagesResult"

  /packages:
    get:
      operationId: listPackages
      tags: [packages]
      summary: List all packages
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
        - name: operation
          in: query
          required: false
          schema:
            type: string
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
          description: ISO date (YYYY-MM-DD). Start of creation date range (inclusive).
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
          description: ISO date (YYYY-MM-DD). End of creation date range (inclusive).
      responses:
        "200":
          description: List of packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Package"
    post:
      operationId: createPackage
      tags: [packages]
      summary: Create a single package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageInput"
      responses:
        "201":
          description: Package created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Package"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Tracking number already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /packages/bulk:
    post:
      operationId: bulkCreatePackages
      tags: [packages]
      summary: Bulk import packages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PackageBulkInput"
      responses:
        "201":
          description: Packages imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /packages/{id}:
    delete:
      operationId: deletePackage
      tags: [packages]
      summary: Delete a package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cities:
    get:
      operationId: listCities
      tags: [packages]
      summary: List distinct cities from packages
      responses:
        "200":
          description: List of cities
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /scans:
    get:
      operationId: listScans
      tags: [scans]
      summary: List scan history
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
        - name: date
          in: query
          required: false
          schema:
            type: string
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
          description: ISO date (YYYY-MM-DD). Start of scan date range (inclusive).
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
          description: ISO date (YYYY-MM-DD). End of scan date range (inclusive).
        - name: operation
          in: query
          required: false
          schema:
            type: string
          description: Filter by operation (e.g. LOGGI, AMAZON).
      responses:
        "200":
          description: List of scans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scan"
    post:
      operationId: createScan
      tags: [scans]
      summary: Record a package scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanInput"
      responses:
        "201":
          description: Scan recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "404":
          description: Tracking number not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Package already scanned today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scans/bulk:
    post:
      operationId: bulkCreateScans
      tags: [scans]
      summary: Register scans for multiple packages at once (without physical scanning)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkScansInput"
      responses:
        "200":
          description: Result with created and skipped counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkScansResult"

  /scans/{id}:
    delete:
      operationId: deleteScan
      tags: [scans]
      summary: Remove a scan from history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /romaneio:
    get:
      operationId: getRomaneio
      tags: [romaneio]
      summary: Get romaneio for a city/route and date
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
        - name: cities
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated list of cities (route mode)
        - name: label
          in: query
          required: false
          schema:
            type: string
          description: Display label for the romaneio (route name)
        - name: date
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Romaneio data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Romaneio"
        "400":
          description: Missing parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get dashboard statistics
      parameters:
        - name: operation
          in: query
          required: false
          schema:
            type: string
          description: Filter statistics by operation (e.g. LOGGI, AMAZON). Defaults to LOGGI if omitted.
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"

components:
  schemas:
    ArcoPingResult:
      type: object
      required: [ok, service]
      properties:
        ok:
          type: boolean
        service:
          type: string

    ArcoLookupResult:
      type: object
      required: [found, trackingNumber, city, route, operation]
      properties:
        found:
          type: boolean
        trackingNumber:
          type: string
        city:
          type: ["string", "null"]
        route:
          type: ["string", "null"]
        operation:
          type: ["string", "null"]

    ArcoConfig:
      type: object
      required: [configured, apiKey, maskedApiKey]
      properties:
        configured:
          type: boolean
        apiKey:
          type: ["string", "null"]
        maskedApiKey:
          type: ["string", "null"]

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Package:
      type: object
      required: [id, trackingNumber, city, promisedDeliveryDate, createdAt]
      properties:
        id:
          type: integer
        trackingNumber:
          type: string
        city:
          type: string
        promisedDeliveryDate:
          type: string
        operation:
          type: string
        createdAt:
          type: string

    PackageInput:
      type: object
      required: [trackingNumber, city, promisedDeliveryDate]
      properties:
        trackingNumber:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        promisedDeliveryDate:
          type: string
          minLength: 1
        operation:
          type: string
          description: Operation identifier (e.g. LOGGI, AMAZON). Defaults to LOGGI.

    PackageBulkInput:
      type: object
      required: [packages]
      properties:
        packages:
          type: array
          items:
            $ref: "#/components/schemas/PackageInput"

    BulkImportResult:
      type: object
      required: [imported, skipped, errors]
      properties:
        imported:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: string

    Scan:
      type: object
      required: [id, trackingNumber, city, scanDate, scannedAt]
      properties:
        id:
          type: integer
        trackingNumber:
          type: string
        city:
          type: string
        scanDate:
          type: string
        scannedBy:
          type: ["string", "null"]
        operation:
          type: string
        scannedAt:
          type: string

    ScanInput:
      type: object
      required: [trackingNumber]
      properties:
        trackingNumber:
          type: string
          minLength: 1
        operation:
          type: string
          description: Operation identifier (e.g. LOGGI, AMAZON). Defaults to LOGGI.

    Romaneio:
      type: object
      required: [city, date, packages, totalCount]
      properties:
        city:
          type: string
        date:
          type: string
        totalCount:
          type: integer
        packages:
          type: array
          items:
            $ref: "#/components/schemas/RomaneioItem"

    RomaneioItem:
      type: object
      required: [trackingNumber, city, promisedDeliveryDate]
      properties:
        trackingNumber:
          type: string
        city:
          type: string
        promisedDeliveryDate:
          type: string

    Stats:
      type: object
      required: [totalPackages, totalScansToday, totalCities, totalUnscanned, unscannedPackages, packagesByCity, scansByOperator, scansByCity]
      properties:
        totalPackages:
          type: integer
        totalScansToday:
          type: integer
        totalCities:
          type: integer
        totalUnscanned:
          type: integer
        unscannedPackages:
          type: array
          items:
            $ref: "#/components/schemas/UnscannedPackage"
        packagesByCity:
          type: array
          items:
            $ref: "#/components/schemas/CityCount"
        scansByOperator:
          type: array
          items:
            $ref: "#/components/schemas/OperatorCount"
        scansByCity:
          type: array
          items:
            $ref: "#/components/schemas/CityCount"

    UnscannedPackage:
      type: object
      required: [id, trackingNumber, city, promisedDeliveryDate]
      properties:
        id:
          type: integer
        trackingNumber:
          type: string
        city:
          type: string
        promisedDeliveryDate:
          type: string

    OperatorCount:
      type: object
      required: [operator, count]
      properties:
        operator:
          type: string
        count:
          type: integer

    CityCount:
      type: object
      required: [city, count]
      properties:
        city:
          type: string
        count:
          type: integer

    BulkScansInput:
      type: object
      required: [trackingNumbers]
      properties:
        trackingNumbers:
          type: array
          items:
            type: string
        operation:
          type: string
          description: Operation identifier (e.g. LOGGI, AMAZON). Defaults to LOGGI.

    BulkScansResult:
      type: object
      required: [created, skipped]
      properties:
        created:
          type: integer
        skipped:
          type: integer

    ClearPackagesResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    DeliveryManifestItem:
      type: object
      required: [id, manifestId, cidade, empresa, sacas, avulsos, responsavel, contato]
      properties:
        id:
          type: integer
        manifestId:
          type: integer
        cidade:
          type: string
        empresa:
          type: string
        sacas:
          type: integer
        avulsos:
          type: integer
        responsavel:
          type: string
        contato:
          type: string

    DeliveryManifest:
      type: object
      required: [id, numero, motorista, conferente, contatoMotorista, rota, rotaPortaAPorta, status, createdAt, items]
      properties:
        id:
          type: integer
        numero:
          type: integer
        motorista:
          type: string
        conferente:
          type: string
        contatoMotorista:
          type: string
        rota:
          type: string
        rotaPortaAPorta:
          type: integer
        km:
          type: ["string", "null"]
        valorPorKm:
          type: ["string", "null"]
        valorPagamento:
          type: ["string", "null"]
        status:
          type: string
        dataPagamento:
          type: ["string", "null"]
        observacoes:
          type: ["string", "null"]
        createdAt:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryManifestItem"

    CityContact:
      type: object
      required: [id, city, responsavel, contato, entregador, motorista, contatoMotorista, conferente, operacao]
      properties:
        id:
          type: integer
        city:
          type: string
        responsavel:
          type: string
        contato:
          type: string
        entregador:
          type: string
        motorista:
          type: string
        contatoMotorista:
          type: string
        conferente:
          type: string
        operacao:
          type: string

    Motorista:
      type: object
      required: [id, nome, contato]
      properties:
        id:
          type: integer
        nome:
          type: string
        contato:
          type: string
        createdAt:
          type: string

    Conferente:
      type: object
      required: [id, nome]
      properties:
        id:
          type: integer
        nome:
          type: string
        createdAt:
          type: string
